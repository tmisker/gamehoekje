<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f12">
  <title>Boerenbridge – Score bijhouden</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#0f0f12;--card:#1b1b20;--card2:#232329;--line:#2e2e36;
      --text:#f4f4f6;--muted:#9a9aa3;--accent:#4caf50;--accent-dim:rgba(76,175,80,.15);
      --red:#e53935;--red-dim:rgba(229,57,53,.12);--gold:#ffd600;
    }
    html{height:100%}
    body{
      min-height:100%;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
      display:flex;flex-direction:column;align-items:center;padding:16px 10px 60px;
    }
    a.backlink{
      align-self:flex-start;color:var(--muted);text-decoration:none;font-size:.9rem;
      margin-bottom:12px;
    }
    a.backlink:hover{color:var(--accent)}
    h1{font-size:1.5rem;margin-bottom:4px;text-align:center}
    .sub{color:var(--muted);font-size:.85rem;margin-bottom:16px;text-align:center}

    /* Start / setup */
    #start{max-width:400px;width:100%;display:flex;flex-direction:column;gap:14px}
    .panel{
      background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;
    }
    .panel h2{font-size:1rem;margin-bottom:12px}
    .panel label{display:block;margin-bottom:6px;font-weight:600;font-size:.95rem}
    .panel input,.panel select{
      width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;
      background:var(--card2);color:var(--text);font-size:1rem;margin-bottom:14px;
    }
    .player-inputs{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
    .player-inputs input{margin-bottom:0}
    button{
      padding:10px 20px;border:none;border-radius:10px;font-size:1rem;font-weight:700;
      cursor:pointer;transition:background .15s,transform .1s;color:#fff;
    }
    button:active{transform:scale(.96)}
    button:disabled{opacity:.5;cursor:default}
    .btn-primary{background:var(--accent);width:100%}
    .btn-primary:hover{background:#43a047}
    .btn-small{padding:7px 14px;font-size:.85rem;border-radius:8px;background:#3a3a3c}
    .btn-small:hover{background:#555}
    .btn-danger{background:var(--red)}
    .btn-danger:hover{background:#c62828}

    .resume-item{
      display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;
      background:var(--card2);border:1px solid var(--line);border-radius:10px;
      padding:12px;margin-bottom:8px;font-weight:400;
    }
    .resume-item:hover{border-color:var(--accent)}
    .resume-item .who{font-weight:700}
    .resume-item .meta{color:var(--muted);font-size:.82rem}
    .display-link{display:block;text-align:center;color:var(--muted);font-size:.9rem;text-decoration:none;padding:6px}
    .display-link:hover{color:var(--accent)}
    details.lb summary{cursor:pointer;font-weight:700;font-size:1rem;list-style:none}
    details.lb summary::-webkit-details-marker{display:none}
    details.lb summary::after{content:' ▸';color:var(--muted)}
    details.lb[open] summary::after{content:' ▾'}
    details.lb table{margin-top:10px}
    .lb-filter{margin-top:12px}
    .lb-filter .hint{color:var(--muted);font-size:.8rem;margin-bottom:6px}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{
      padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card2);
      color:var(--muted);font-size:.82rem;font-weight:600;width:auto;
    }
    .chip.on{background:var(--red-dim);border-color:var(--red);color:var(--text)}
    .lb-count{color:var(--muted);font-size:.8rem;margin-top:10px}
    /* naamsuggesties onder de invoervelden */
    #nameSuggest .chips{margin:-4px 0 14px}
    #nameSuggest .chip.used{background:var(--accent-dim);border-color:var(--accent);color:var(--text)}
    #nameSuggest .chip.more{color:var(--accent);border-style:dashed}

    /* Game */
    #game{width:100%;max-width:600px;display:none;flex-direction:column;gap:14px}
    .round-header{
      text-align:center;background:var(--card);border:1px solid var(--line);
      border-radius:12px;padding:14px;
    }
    .round-header .suit{font-size:2rem}
    .round-header .info{font-size:1.1rem;font-weight:700;margin-top:4px}
    .round-header .step{color:var(--muted);font-size:.85rem;margin-top:2px}
    .round-header .dealer{color:var(--gold);font-size:.9rem;margin-top:6px;font-weight:600}

    /* Input grid */
    .input-section{
      background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;
    }
    .input-section h3{font-size:.95rem;margin-bottom:10px;color:var(--muted)}
    .num-row{margin-bottom:12px}
    .num-row .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:5px}
    .num-row .pname{font-weight:600;font-size:.95rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .num-row .dealer-badge{font-size:.75rem;color:var(--gold);margin-left:4px;font-weight:400}
    .num-row .predicted{color:var(--muted);font-size:.85rem;white-space:nowrap}
    .numgrid{display:grid;gap:5px}
    .numbtn{
      padding:0;height:42px;min-width:0;border:1px solid var(--line);border-radius:9px;
      background:var(--card2);color:var(--text);font-size:1rem;font-weight:700;
    }
    .numbtn.sel{background:var(--accent);border-color:var(--accent)}
    .numbtn:disabled{opacity:.25;cursor:default}
    /* in de slagen-fase: gouden ring om het voorspelde aantal */
    .numbtn.predmark{box-shadow:inset 0 0 0 2px var(--gold)}
    .sumline{color:var(--muted);font-size:.9rem;text-align:center;margin:2px 0 4px}
    .sumline b{color:var(--text)}
    /* live tussenstand onder de slagen-invoer (door de server berekend) */
    .projline{
      color:var(--muted);font-size:.85rem;text-align:center;line-height:1.6;
      margin:6px 0 2px;
    }
    .projline .lbl{display:block;font-size:.75rem;letter-spacing:.02em;opacity:.85}
    .projline .p{white-space:nowrap;margin:0 .1em}
    .projline b{color:var(--text)}
    .projline .pos{color:var(--accent);font-weight:700}
    .projline .neg{color:var(--red);font-weight:700}
    .warn{color:var(--gold);font-size:.82rem;text-align:center;margin-top:4px}
    .error{color:var(--red);font-size:.82rem;text-align:center;margin-top:4px}
    .conn-banner{
      display:none;background:var(--red-dim);border:1px solid var(--red);border-radius:10px;
      padding:10px;text-align:center;font-size:.9rem;
    }
    .conn-banner button{margin-top:8px}

    .btn-row{display:flex;gap:8px;justify-content:center;margin-top:6px}

    /* Scoreboard */
    .scoreboard{
      background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:14px;overflow-x:auto;
    }
    table{width:100%;border-collapse:collapse;font-size:.85rem;white-space:nowrap}
    th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
    th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
    td.pos .d{color:var(--accent);font-weight:700}
    td.neg .d{color:var(--red)}
    td .d{display:block;line-height:1.2}
    td .c{display:block;font-size:.78em;font-weight:600;color:var(--muted);line-height:1.2}
    tr.current-round{background:var(--accent-dim)}
    tfoot td{font-weight:700;font-size:.95rem;border-top:2px solid var(--line)}
    tfoot td .c{font-size:.75em;color:var(--muted);font-weight:600}
    tfoot td.top .d{color:var(--gold)}

    /* Finished */
    .winner-banner{
      text-align:center;padding:20px;background:var(--card);border:2px solid var(--gold);
      border-radius:14px;
    }
    .winner-banner .trophy{font-size:3rem}
    .winner-banner .name{font-size:1.4rem;font-weight:800;color:var(--gold);margin-top:6px}
    .winner-banner .score{color:var(--muted);margin-top:4px}

    @media(max-width:380px){
      .numbtn{height:38px;font-size:.9rem;border-radius:7px}
      .numgrid{gap:4px}
      table{font-size:.78rem}
      th,td{padding:4px 5px}
    }
  </style>
</head>
<body>
  <a class="backlink" href="../../index.html">← Alle spellen</a>
  <h1>🃏 Boerenbridge</h1>
  <p class="sub">Score bijhouden</p>

  <!-- START -->
  <div id="start">
    <div class="conn-banner" id="startConn">
      Geen verbinding met de server
      <button class="btn-small" id="startRetry">Opnieuw proberen</button>
    </div>
    <div class="panel" id="resumePanel" style="display:none">
      <h2>Verder spelen</h2>
      <div id="resumeList"></div>
    </div>
    <div class="panel">
      <h2>Nieuw spel</h2>
      <label>Aantal spelers</label>
      <select id="playerCount">
        <option value="3">3 spelers</option>
        <option value="4" selected>4 spelers</option>
        <option value="5">5 spelers</option>
        <option value="6">6 spelers</option>
      </select>
      <label>Namen</label>
      <div class="player-inputs" id="nameInputs"></div>
      <div id="nameSuggest"></div>
      <datalist id="knownNames"></datalist>
      <div id="startWarn"></div>
      <button class="btn-primary" id="startBtn">Starten</button>
    </div>
    <div class="panel">
      <details class="lb" id="lbDetails">
        <summary>🏆 Klassement</summary>
        <div class="lb-filter" id="lbFilter"></div>
        <div id="lbArea" style="overflow-x:auto"></div>
        <div class="lb-count" id="lbCount"></div>
      </details>
    </div>
    <a class="display-link" href="display/">📺 Scherm-weergave openen</a>
  </div>

  <!-- GAME -->
  <div id="game">
    <div class="round-header" id="roundHeader">
      <div class="suit" id="roundSuit"></div>
      <div class="info" id="roundInfo"></div>
      <div class="step" id="roundStep"></div>
      <div class="dealer" id="roundDealer"></div>
    </div>

    <div class="conn-banner" id="gameConn">
      Geen verbinding met de server
      <button class="btn-small" id="gameRetry">Opnieuw proberen</button>
    </div>

    <div class="input-section" id="inputSection"></div>

    <div class="scoreboard">
      <table id="scoreTable">
        <thead id="scoreHead"></thead>
        <tbody id="scoreBody"></tbody>
        <tfoot id="scoreFoot"></tfoot>
      </table>
    </div>

    <div id="winnerArea"></div>

    <div class="btn-row">
      <button class="btn-small" id="backToStartBtn">↩ Naar overzicht</button>
      <button class="btn-small btn-danger" id="abandonBtn">Spel afbreken</button>
    </div>
  </div>

<script>
(function(){
  const API = '../../api/boerenbridge';
  let game = null; // verrijkt serverobject; de server is autoritatief
  let lastFailed = null; // {run} — laatst mislukte actie, voor "Opnieuw proberen"
  // Namen die het klassement buiten beschouwing laat: potjes waarin zij
  // meededen tellen niet mee. Blijft staan tussen bezoeken.
  const LB_KEY = 'bb-klassement-zonder';
  let lbExclude = [];
  try{ lbExclude = JSON.parse(localStorage.getItem(LB_KEY)) || []; }catch(e){}
  if(!Array.isArray(lbExclude)) lbExclude = [];

  const $=s=>document.querySelector(s);

  // ---- API-helper ----
  async function api(method, path, body){
    const res = await fetch(API + path, {
      method,
      headers: body ? {'Content-Type':'application/json'} : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = null;
    try{ data = await res.json(); }catch(e){}
    if(!res.ok){
      const err = new Error((data && data.error) || 'Serverfout');
      err.status = res.status;
      throw err;
    }
    return data;
  }

  // Voert een actie uit; bij netwerk/serverfout → banner + retry, bij 409 → refetch.
  async function attempt(run, connBannerId){
    lastFailed = null;
    $('#startConn').style.display='none';
    $('#gameConn').style.display='none';
    try{
      await run();
    }catch(err){
      if(err.status === 409 && game){
        game = await api('GET','/games/'+game.id).catch(()=>null);
        if(game) renderGame('Spel is elders bijgewerkt');
        else showStart();
        return;
      }
      if(err.status === 404 && game){ game=null; showStart(); return; }
      if(err.status && err.status < 500){
        // validatiefout: toon in het formulier
        const warn = $('#predWarn') || $('#actWarn') || $('#startWarn');
        if(warn) warn.innerHTML = '<span class="error">'+esc(err.message)+'</span>';
        return;
      }
      lastFailed = run;
      $(connBannerId).style.display='block';
    }
  }
  $('#startRetry').addEventListener('click',()=>{ if(lastFailed) attempt(lastFailed,'#startConn'); });
  $('#gameRetry').addEventListener('click',()=>{ if(lastFailed) attempt(lastFailed,'#gameConn'); });

  // ---- startscherm ----
  const countSel=$('#playerCount'), nameDiv=$('#nameInputs');
  function updateNameInputs(){
    const n=+countSel.value;
    const old=[...nameDiv.querySelectorAll('input')].map(inp=>inp.value);
    nameDiv.innerHTML='';
    for(let i=0;i<n;i++){
      const inp=document.createElement('input');
      inp.placeholder='Speler '+(i+1);
      inp.setAttribute('list','knownNames');
      inp.autocapitalize='words';
      inp.dataset.idx=i;
      if(old[i]) inp.value=old[i];
      nameDiv.appendChild(inp);
    }
    renderNameSuggest();
  }
  countSel.addEventListener('change',updateNameInputs);
  nameDiv.addEventListener('input',renderNameSuggest);

  // Tikbare naamsuggesties: de server sorteert op vaakst-meespelend, dus de
  // vaste groep staat vooraan. Tikken vult het eerste lege veld; nogmaals
  // tikken haalt de naam weer weg. Typen kan altijd nog (nieuwe spelers).
  let knownNames=[]; // volgorde van de server (lb.suggestions)
  let namesOpen=false;
  const NAME_LIMIT=12;

  function renderNameSuggest(){
    const box=$('#nameSuggest');
    box.innerHTML='';
    if(!knownNames.length) return;
    const used=new Set([...nameDiv.querySelectorAll('input')]
      .map(inp=>inp.value.trim().toLowerCase()).filter(Boolean));
    const chips=document.createElement('div');
    chips.className='chips';
    (namesOpen?knownNames:knownNames.slice(0,NAME_LIMIT)).forEach(name=>{
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='chip'+(used.has(name.toLowerCase())?' used':'');
      btn.textContent=name;
      btn.addEventListener('click',()=>toggleName(name));
      chips.appendChild(btn);
    });
    if(knownNames.length>NAME_LIMIT){
      const more=document.createElement('button');
      more.type='button';
      more.className='chip more';
      more.textContent=namesOpen?'minder':'+'+(knownNames.length-NAME_LIMIT)+' meer';
      more.addEventListener('click',()=>{ namesOpen=!namesOpen; renderNameSuggest(); });
      chips.appendChild(more);
    }
    box.appendChild(chips);
  }

  function toggleName(name){
    const inputs=[...nameDiv.querySelectorAll('input')];
    const key=name.toLowerCase();
    const has=inputs.find(inp=>inp.value.trim().toLowerCase()===key);
    if(has) has.value='';
    else{
      const empty=inputs.find(inp=>!inp.value.trim());
      if(!empty) return; // alle velden vol
      empty.value=name;
    }
    renderNameSuggest();
  }
  updateNameInputs();

  function showStart(){
    game=null;
    $('#game').style.display='none';
    $('#start').style.display='flex';
    $('#startWarn').innerHTML='';
    attempt(loadStartData,'#startConn');
  }

  async function loadStartData(){
    const [list] = await Promise.all([
      api('GET','/games?status=active'),
      loadLeaderboard(),
    ]);
    // hervat-lijst
    const panel=$('#resumePanel'), listDiv=$('#resumeList');
    listDiv.innerHTML='';
    panel.style.display = list.games.length ? '' : 'none';
    list.games.forEach(g=>{
      const btn=document.createElement('button');
      btn.className='resume-item';
      const date=new Date(g.createdAt).toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
      btn.innerHTML='<span class="who">'+g.players.map(esc).join(', ')+'</span>'
        +'<span class="meta">Ronde '+(Math.min(g.currentRound,g.totalRounds-1)+1)+' van '+g.totalRounds+' · '+date+'</span>';
      btn.addEventListener('click',()=>attempt(async()=>{
        game = await api('GET','/games/'+g.id);
        renderGame();
      },'#startConn'));
      listDiv.appendChild(btn);
    });
  }

  async function loadLeaderboard(){
    const qs = lbExclude.map(n=>'exclude='+encodeURIComponent(n)).join('&');
    const lb = await api('GET','/leaderboard'+(qs?'?'+qs:''));
    // Suggesties komen uit actieve en afgeronde potjes (afgebroken niet) en
    // staan op vaakst-meespelend; het klassement-filter erop toepassen zou
    // namen uit de invoerhulp laten verdwijnen.
    knownNames = lb.suggestions || lb.players;
    renderNameSuggest();
    const dl=$('#knownNames');
    dl.innerHTML='';
    knownNames.forEach(name=>{
      const opt=document.createElement('option');
      opt.value=name;
      dl.appendChild(opt);
    });
    renderLbFilter(lb);
    renderLeaderboard(lb);
    $('#lbCount').textContent = lb.excluded.length
      ? lb.gamesCounted+' van '+lb.gamesTotal+' potjes tellen mee'
      : '';
  }

  // Chips om spelers uit te sluiten; klik = potjes met die speler weglaten.
  function renderLbFilter(lb){
    const box=$('#lbFilter');
    box.innerHTML='';
    if(!lb.players.length) return;
    const hint=document.createElement('div');
    hint.className='hint';
    hint.textContent='Potjes weglaten waarin deze spelers meededen:';
    const chips=document.createElement('div');
    chips.className='chips';
    const off = new Set(lb.excluded.map(n=>n.toLowerCase()));
    lb.players.forEach(name=>{
      const btn=document.createElement('button');
      btn.className='chip'+(off.has(name.toLowerCase())?' on':'');
      btn.textContent=name;
      btn.addEventListener('click',()=>toggleExclude(name));
      chips.appendChild(btn);
    });
    box.appendChild(hint);
    box.appendChild(chips);
  }

  function toggleExclude(name){
    const key=name.toLowerCase();
    lbExclude = lbExclude.some(n=>n.toLowerCase()===key)
      ? lbExclude.filter(n=>n.toLowerCase()!==key)
      : lbExclude.concat(name);
    try{ localStorage.setItem(LB_KEY, JSON.stringify(lbExclude)); }catch(e){}
    attempt(loadLeaderboard,'#startConn');
  }

  function renderLeaderboard(lb){
    const area=$('#lbArea'), rows=lb.leaderboard;
    if(!rows.length){
      const msg = lb.excluded.length
        ? 'Geen potjes zonder '+lb.excluded.join(', ')+'.'
        : 'Nog geen afgeronde spellen.';
      area.innerHTML='<p class="sub" style="margin:10px 0 0">'+esc(msg)+'</p>';
      return;
    }
    let html='<table><thead><tr><th>Speler</th><th>Potjes</th><th>Gewonnen</th><th>Gem.</th><th>Beste</th></tr></thead><tbody>';
    rows.forEach(e=>{
      html+='<tr><td>'+esc(e.name)+'</td><td>'+e.gamesPlayed+'</td><td>'+e.wins+'</td><td>'+e.avgPoints+'</td><td>'+e.bestScore+'</td></tr>';
    });
    area.innerHTML=html+'</tbody></table>';
  }

  $('#startBtn').addEventListener('click',()=>{
    const names=[...nameDiv.querySelectorAll('input')].map((inp,i)=>inp.value.trim()||('Speler '+(i+1)));
    attempt(async()=>{
      game = await api('POST','/games',{players:names});
      renderGame();
    },'#startConn');
  });

  // ---- spelscherm ----
  function renderGame(notice){
    $('#start').style.display='none';
    $('#game').style.display='flex';
    $('#gameConn').style.display='none';
    renderScoreTable();
    if(game.status!=='active'){
      $('#roundSuit').textContent='';
      $('#roundInfo').textContent = game.status==='finished' ? '' : 'Spel afgebroken';
      $('#roundStep').textContent = game.status==='finished' ? 'Spel afgelopen!' : '';
      $('#roundDealer').textContent='';
      $('#inputSection').style.display='none';
      if(game.status==='finished') showWinner(); else $('#winnerArea').innerHTML='';
      return;
    }
    $('#winnerArea').innerHTML='';
    $('#inputSection').style.display='';
    const ri=game.roundInfo;
    $('#roundSuit').textContent=ri.suit;
    $('#roundSuit').style.color=ri.suitColor;
    $('#roundInfo').textContent=ri.suitName+' '+ri.cards;
    $('#roundStep').textContent='Ronde '+(game.currentRound+1)+' van '+game.rounds.length;
    $('#roundDealer').textContent='Deler: '+game.players[game.dealerIdx];
    if(game.phase==='predict') showPredictForm(notice);
    else showActualForm(notice);
  }

  // ---- knopgroep-invoer ----
  // sel = huidige keuze per speler (null = nog niet gekozen). Elke wijziging
  // gaat als concept ("draft") naar de server zodat het scorebord live meekijkt.
  let sel=[];
  let draftChain=Promise.resolve();

  function initSel(){
    const n=game.players.length, d=game.draft;
    sel=(d&&d.phase===game.phase&&Array.isArray(d.values)&&d.values.length===n)
      ? d.values.slice()
      : new Array(n).fill(null);
  }

  function sendDraft(){
    const payload={round:game.currentRound,phase:game.phase,values:sel.slice()};
    const id=game.id;
    // serialiseer: snelle tikken mogen elkaar niet inhalen; fouten zijn
    // niet-blokkerend (de echte bevestiging vangt alles alsnog af)
    draftChain=draftChain.then(async()=>{
      try{
        const res=await api('POST','/games/'+id+'/draft',payload);
        // De server stuurt de tussenstand mee (spelregels horen daar, niet
        // hier); alleen tonen als we nog in dezelfde ronde/fase zitten.
        if(game&&game.id===id&&game.currentRound===payload.round&&game.phase===payload.phase){
          showProjection(res.projection);
        }
      }
      catch(err){
        // 409 door een eigen bevestiging die de draft inhaalde → stil negeren;
        // alleen refetchen als we lokaal nog in dezelfde ronde/fase zitten.
        if(err.status===409&&game&&game.id===id
           &&game.currentRound===payload.round&&game.phase===payload.phase){
          try{ game=await api('GET','/games/'+id); renderGame('Spel is elders bijgewerkt'); }catch(e){}
        }
      }
    });
  }

  function numRows(withPredicted){
    const preds=game.predictions[game.currentRound];
    const cards=game.roundInfo.cards;
    let html='';
    game.playerOrder.forEach(pi=>{
      const badge=pi===game.dealerIdx?' <span class="dealer-badge">(deler)</span>':'';
      html+='<div class="num-row" data-pi="'+pi+'"><div class="top">'
        +'<span class="pname">'+esc(game.players[pi])+badge+'</span>'
        +(withPredicted?'<span class="predicted">voorspeld: '+preds[pi]+'</span>':'')
        +'</div><div class="numgrid" style="grid-template-columns:repeat('+(cards+1)+',1fr)">';
      for(let v=0;v<=cards;v++){
        html+='<button type="button" class="numbtn'+(withPredicted&&v===preds[pi]?' predmark':'')
          +'" data-v="'+v+'">'+v+'</button>';
      }
      html+='</div></div>';
    });
    return html;
  }

  // Uitgrijzen in de slagen-fase: samen nooit boven het aantal kaarten, en wie
  // als laatste nog moet kiezen kan alleen het exacte restant aantikken.
  // Een al gekozen speler mag wél lager (correctie); de som-check bij
  // Bevestigen blijft de eindcontrole.
  function refreshNumRows(sec,isActual){
    const cards=game.roundInfo.cards;
    sec.querySelectorAll('.num-row').forEach(row=>{
      const pi=+row.dataset.pi;
      let sOthers=0,uOthers=0;
      sel.forEach((v,j)=>{ if(j===pi)return; if(v==null)uOthers++; else sOthers+=v; });
      row.querySelectorAll('.numbtn').forEach(btn=>{
        const v=+btn.dataset.v;
        btn.classList.toggle('sel',sel[pi]===v);
        btn.disabled=isActual&&!(sOthers+v<=cards&&(uOthers>0||sel[pi]!=null||sOthers+v===cards));
      });
    });
  }

  function wireNumRows(sec,isActual,onChange){
    sec.querySelectorAll('.num-row').forEach(row=>{
      const pi=+row.dataset.pi;
      row.querySelectorAll('.numbtn').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const v=+btn.dataset.v;
          sel[pi]=(sel[pi]===v)?null:v; // nogmaals tikken = keuze wissen
          refreshNumRows(sec,isActual);
          sendDraft();
          onChange();
        });
      });
    });
    refreshNumRows(sec,isActual);
  }

  // Live tussenstand: waar de stand op uitkomt als de ingetikte slagen zo
  // blijven staan. game.projection komt van de server; wij renderen alleen.
  function showProjection(pr){
    const box=document.getElementById('projLine');
    if(!box) return;
    if(!pr){ box.innerHTML=''; return; }
    const order=game.players.map((p,i)=>i).sort((a,b)=>pr.totals[b]-pr.totals[a]);
    box.innerHTML='<span class="lbl">Tussenstand als dit klopt</span>'
      +order.map(i=>{
        const d=pr.deltas[i];
        return '<span class="p"><b>'+esc(game.players[i])+'</b> '+pr.totals[i]
          +(d!=null?' <span class="'+(d>0?'pos':d<0?'neg':'')+'">'+(d>0?'+':'')+d+'</span>':'')
          +'</span>';
      }).join(' · ');
  }

  function selTotal(){ return sel.reduce((a,v)=>a+(v||0),0); }
  function selMissing(){ return sel.filter(v=>v==null).length; }

  function showPredictForm(notice){
    const cards=game.roundInfo.cards;
    const sec=$('#inputSection');
    initSel();
    sec.innerHTML='<h3>Hoeveel slagen raad je? (max '+cards+')</h3>'
      +numRows(false)
      +'<div class="sumline" id="predSum"></div>'
      +'<div id="predWarn">'+(notice?'<span class="warn">'+esc(notice)+'</span>':'')+'</div>'
      +'<div class="btn-row">'
      +(game.currentRound>0?'<button class="btn-small" id="predUndo">← Terug</button>':'')
      +'<button class="btn-primary" style="flex:1" id="predOk">Slagen invoeren →</button></div>';

    const okBtn=document.getElementById('predOk');
    function updateState(){
      const total=selTotal(), missing=selMissing();
      $('#predSum').innerHTML='Samen voorspeld: <b>'+total+'</b> van '+cards+' slagen'
        +(missing?' · nog '+missing+(missing===1?' speler':' spelers'):'');
      okBtn.disabled=missing>0;
    }
    updateState();
    wireNumRows(sec,false,()=>{
      const w=document.getElementById('predWarn');
      delete w.dataset.warned;
      w.innerHTML='';
      updateState();
    });

    const undoBtn=document.getElementById('predUndo');
    if(undoBtn) undoBtn.addEventListener('click',()=>attempt(async()=>{
      game = await api('POST','/games/'+game.id+'/undo');
      renderGame();
    },'#gameConn'));

    okBtn.addEventListener('click',()=>{
      if(selMissing()>0) return;
      const preds=sel.slice();
      const total=preds.reduce((a,b)=>a+b,0);
      // advieswaarschuwing blijft client-side; blokkeert niet
      if(total===cards){
        const w=document.getElementById('predWarn');
        if(!w.dataset.warned){
          w.dataset.warned='1';
          w.innerHTML='<span class="warn">⚠ Totaal voorspeld ('+total+') is gelijk aan het aantal kaarten ('+cards+') — druk nogmaals om door te gaan</span>';
          return;
        }
      }
      okBtn.disabled=true;
      attempt(async()=>{
        game = await api('POST','/games/'+game.id+'/predictions',{round:game.currentRound,predictions:preds});
        renderGame();
      },'#gameConn').finally(()=>{ okBtn.disabled=selMissing()>0; });
    });
  }

  function showActualForm(notice){
    const cards=game.roundInfo.cards;
    const sec=$('#inputSection');
    initSel();
    sec.innerHTML='<h3>Werkelijke slagen</h3>'
      +numRows(true)
      +'<div class="sumline" id="actSum"></div>'
      +'<div class="projline" id="projLine"></div>'
      +'<div id="actWarn">'+(notice?'<span class="warn">'+esc(notice)+'</span>':'')+'</div>'
      +'<div class="btn-row">'
      +'<button class="btn-small" id="actBack">← Terug</button>'
      +'<button class="btn-primary" style="flex:1" id="actOk">Bevestigen ✓</button></div>';

    const okBtn=document.getElementById('actOk');
    function updateState(){
      const total=selTotal(), missing=selMissing();
      $('#actSum').innerHTML='Samen: <b>'+total+'</b> van '+cards+' slagen'
        +(missing?' · nog '+missing+(missing===1?' speler':' spelers'):'');
      okBtn.disabled=missing>0||total!==cards;
    }
    updateState();
    showProjection(game.projection); // al ingevoerde concept-slagen meteen tonen
    wireNumRows(sec,true,()=>{
      document.getElementById('actWarn').innerHTML='';
      updateState();
    });

    document.getElementById('actBack').addEventListener('click',()=>attempt(async()=>{
      game = await api('POST','/games/'+game.id+'/undo');
      renderGame();
    },'#gameConn'));

    okBtn.addEventListener('click',()=>{
      const acts=sel.slice();
      if(selMissing()>0||selTotal()!==cards) return;
      okBtn.disabled=true;
      attempt(async()=>{
        game = await api('POST','/games/'+game.id+'/actuals',{round:game.currentRound,actuals:acts});
        renderGame();
      },'#gameConn').finally(()=>{ okBtn.disabled=selMissing()>0||selTotal()!==cards; });
    });
  }

  function renderScoreTable(){
    let headHtml='<tr><th>Ronde</th>';
    game.players.forEach(p=>{headHtml+='<th>'+esc(p)+'</th>';});
    $('#scoreHead').innerHTML=headHtml+'</tr>';

    // Per ronde de punten van die ronde (groot) én de stand op dat moment
    // (game.cumulative van de server) — zo blijft de tussenstand zichtbaar.
    let bodyHtml='';
    const played=game.roundScores.length;
    for(let r=0;r<played;r++){
      const rd=game.rounds[r];
      const cls=r===played-1?' class="current-round"':'';
      bodyHtml+='<tr'+cls+'><td>'+SUITS_LOCAL[rd.suitIdx]+' '+rd.cards+'</td>';
      game.roundScores[r].forEach((s,i)=>{
        const c=s>0?'pos':s<0?'neg':'';
        bodyHtml+='<td class="'+c+'"><span class="d">'+(s>0?'+':'')+s+'</span>'
          +'<span class="c">'+game.cumulative[r][i]+'</span></td>';
      });
      bodyHtml+='</tr>';
    }
    $('#scoreBody').innerHTML=bodyHtml;

    let footHtml='<tr><td>Totaal</td>';
    game.totals.forEach((t,i)=>{
      footHtml+='<td class="'+(played&&game.positions[i]===1?'top':'')+'"><span class="d">'+t+'</span>'
        +'<span class="c">'+(played?ORD_LOCAL[game.positions[i]-1]:'')+'</span></td>';
    });
    $('#scoreFoot').innerHTML=footHtml+'</tr>';
  }
  const SUITS_LOCAL=['♣','♥','♦','♠','Sans'];
  const ORD_LOCAL=['1e','2e','3e','4e','5e','6e'];

  function showWinner(){
    const names=game.winnerIdxs.map(i=>esc(game.players[i])).join(' & ');
    const max=Math.max(...game.totals);
    $('#winnerArea').innerHTML='<div class="winner-banner">'
      +'<div class="trophy">🏆</div>'
      +'<div class="name">'+names+(game.winnerIdxs.length>1?' winnen!':' wint!')+'</div>'
      +'<div class="score">'+max+' punten</div></div>';
  }

  // ---- knoppen onder het spel ----
  $('#backToStartBtn').addEventListener('click',showStart);
  $('#abandonBtn').addEventListener('click',()=>{
    if(game && game.status!=='active'){ showStart(); return; }
    if(!confirm('Dit spel afbreken? Het telt dan niet mee voor het klassement.')) return;
    attempt(async()=>{
      await api('POST','/games/'+game.id+'/abandon');
      showStart();
    },'#gameConn');
  });

  // Telefoon uit slaapstand: state kan verouderd zijn → refetch.
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState!=='visible') return;
    if(game) attempt(async()=>{
      game = await api('GET','/games/'+game.id);
      renderGame();
    },'#gameConn');
    else showStart();
  });

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

  showStart();
})();
</script>
</body>
</html>
