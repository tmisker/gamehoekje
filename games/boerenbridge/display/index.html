<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f12">
  <title>Boerenbridge – Scorebord</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#0f0f12;--card:#1b1b20;--card2:#232329;--line:#2e2e36;
      --text:#f4f4f6;--muted:#9a9aa3;--accent:#4caf50;--accent-dim:rgba(76,175,80,.15);
      --red:#e53935;--gold:#ffd600;--orange:#ff9800;
    }
    html,body{height:100%}
    body{
      background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
      display:flex;flex-direction:column;padding:20px;gap:16px;
    }

    /* verbindingsstip */
    #connDot{
      position:fixed;top:12px;right:12px;width:10px;height:10px;border-radius:50%;
      background:var(--red);z-index:10;transition:background .3s;
    }
    #connDot.ok{background:var(--accent)}

    /* bovenbalk */
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:20px;
      background:var(--card);border:1px solid var(--line);border-radius:16px;
      padding:14px 24px;
    }
    .topbar .trump{display:flex;align-items:center;gap:14px}
    .topbar .trump .suit{font-size:3.2rem;line-height:1}
    .topbar .trump .txt .big{font-size:1.5rem;font-weight:800}
    .topbar .trump .txt .small{color:var(--muted);font-size:1rem}
    .topbar .round{font-size:1.3rem;font-weight:700;text-align:center}
    .topbar .dealer{color:var(--gold);font-size:1.2rem;font-weight:700;text-align:right}

    /* spelerskaarten */
    /* Kaartbreedte gecapt en gecentreerd: bij twee of drie spelers zou een
       kaart anders de halve breedte van een iPad pakken. */
    .players{display:grid;gap:12px;margin-inline:auto;width:100%}
    .pcard{
      background:var(--card);border:1px solid var(--line);border-radius:16px;
      padding:24px 10px 14px;text-align:center;display:flex;flex-direction:column;gap:4px;
      position:relative;
    }
    .pcard.leader{border-color:var(--gold)}
    .pcard.chosen{border-color:var(--accent)}
    .pcard .crown{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:1.3rem}
    .pcard .nm{
      font-size:1.15rem;font-weight:700;
      display:flex;align-items:center;justify-content:center;gap:.35em;min-width:0;
    }
    /* Alleen de naam zelf krimpt; lange namen krijgen een ellipsis in plaats
       van de kaartkolom breder te duwen. */
    .pcard .nm .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pcard .rank{position:absolute;top:5px;left:11px;color:var(--muted);font-size:.9rem;font-weight:800}
    .pcard.leader .rank{color:var(--gold)}
    .pcard .lab{color:var(--muted);font-size:.85rem}
    .pcard .tot{font-size:2.6rem;font-weight:800;line-height:1.1}
    .pcard .tot .unknown{color:var(--muted)}
    .pcard .stat{color:var(--muted);font-size:.95rem;min-height:1.3em}
    /* k-exact = voorspelling gehaald (bonus), k-over = pluspunten zonder bonus,
       k-under = minpunten */
    .pcard .stat .k-exact{color:var(--accent);font-weight:700}
    .pcard .stat .k-over{color:var(--orange);font-weight:700}
    .pcard .stat .k-under{color:var(--red);font-weight:700}
    .pcard .dealerdot{flex:0 0 auto;color:var(--gold);font-size:.85rem}
    /* tweede regel: de doorlopende tussenstand, op élk scherm zichtbaar */
    .pcard .sub{color:var(--muted);font-size:.95rem;min-height:1.3em}
    .pcard .sub b{color:var(--text);font-weight:800}
    .pcard .sub .k-exact{color:var(--accent);font-weight:800}
    .pcard .sub .k-over{color:var(--orange);font-weight:800}
    .pcard .sub .k-under{color:var(--red);font-weight:800}
    .pcard .sub .arrow{opacity:.6;margin:0 .15em}

    /* groot "samen gevraagd"-blok (voorspel- en speelscherm) */
    .fillcenter{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
    .fillcenter>.livewrap{flex:1;min-height:0}
    .livewrap{display:flex;gap:14px;align-items:stretch;min-height:0}
    .livewrap>.askbar{flex:0 0 34%;display:flex;flex-direction:column;justify-content:center}
    .livewrap>.askbar:only-child{flex:1 1 auto}
    .askbar{
      background:var(--card);border:1px solid var(--line);border-radius:20px;
      padding:28px 24px;text-align:center;
    }
    .askbar .lbl{color:var(--muted);font-size:1.3rem;font-weight:600}
    .askbar .num{font-size:5.5rem;font-weight:800;line-height:1.1}
    .askbar .num .of{font-size:2.2rem;color:var(--muted);font-weight:700}
    .askbar .delta{font-size:1.4rem;font-weight:700;margin-top:4px}
    .askbar .delta.over{color:var(--red)}
    .askbar .delta.under{color:var(--gold)}
    .askbar .delta.even{color:var(--accent)}
    .askbar .delta.wait{color:var(--muted);font-weight:600}

    /* verloop van de stand (SVG, meeschalend) */
    .boardwrap{flex:1;min-height:0;display:flex;gap:14px}
    .boardwrap>.scoreboard{flex:1.3 1 0}
    .boardwrap>.scoreboard:only-child{flex:1 1 auto}
    .trend{
      flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);
      border-radius:20px;padding:12px 14px 8px;display:flex;flex-direction:column;
    }
    .trend h3{color:var(--muted);font-size:.95rem;font-weight:600;text-align:center;margin-bottom:4px}
    .trend .canvas{flex:1;min-height:0;min-width:0}
    .trend svg{display:block}
    /* Smal scherm: de grafiek kost te veel hoogte — dan alleen de cijfers. */
    @media(max-width:900px){.trend{display:none}.livewrap>.askbar{flex:1 1 auto}}

    /* scoretabel */
    .scoreboard{
      flex:1;min-height:0;background:var(--card);border:1px solid var(--line);
      border-radius:16px;padding:14px;overflow:auto;
    }
    table{width:100%;border-collapse:collapse;font-size:1rem;white-space:nowrap}
    th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card);z-index:1}
    th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
    td.k-exact .d{color:var(--accent);font-weight:700}
    td.k-over .d{color:var(--orange);font-weight:700}
    td.k-under .d{color:var(--red)}
    td .d{display:block;line-height:1.15}
    td .c{display:block;font-size:.8em;font-weight:600;color:var(--muted);line-height:1.15}
    tr.current-round{background:var(--accent-dim)}
    tfoot td{font-weight:800;font-size:1.1rem;border-top:2px solid var(--line)}
    tfoot td .c{font-size:.72em;color:var(--muted)}
    tfoot td.top .d{color:var(--gold)}

    /* winnaar / idle */
    .center{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:20px;text-align:center;
    }
    .winner-banner{
      padding:40px 60px;background:var(--card);border:3px solid var(--gold);border-radius:24px;
    }
    .winner-banner .trophy{font-size:5rem}
    .winner-banner .name{font-size:2.6rem;font-weight:800;color:var(--gold);margin-top:10px}
    .winner-banner .score{color:var(--muted);font-size:1.4rem;margin-top:6px}
    .standings{font-size:1.2rem;color:var(--muted)}
    .standings b{color:var(--text)}
    .idle-title{font-size:1.6rem;font-weight:700}
    .idle-sub{color:var(--muted);font-size:1.05rem}
    .lb-panel{
      background:var(--card);border:1px solid var(--line);border-radius:16px;
      padding:20px;max-width:640px;width:100%;overflow-x:auto;
    }
    .lb-panel h2{font-size:1.2rem;margin-bottom:12px;text-align:center}

    /* weetje van de ronde — de server kiest en formuleert, wij tonen */
    .factbar{
      display:flex;align-items:center;justify-content:center;gap:14px;
      background:var(--card);border:1px solid var(--line);border-radius:16px;
      padding:12px 22px;font-size:1.35rem;font-weight:600;text-align:center;
    }
    .factbar .ic{font-size:1.6rem;line-height:1}
    /* hoogtepunten op het eindscherm */
    .highlights{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;
      background:var(--card);border:1px solid var(--line);border-radius:16px;
      padding:18px 24px;max-width:1000px;width:100%;text-align:left;font-size:1.15rem;
    }
    .highlights .hl{display:flex;gap:10px;align-items:flex-start}
    .highlights .ic{flex:0 0 auto;font-size:1.3rem;line-height:1.2}
    /* eretitels onder het klassement (idle-scherm) */
    .awards{
      display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:center;margin-top:14px;
      color:var(--muted);font-size:.95rem;
    }
    .awards b{color:var(--text)}
    /* wisselend weetje over de tafel, als er geen potje loopt */
    .tablefact{
      display:flex;align-items:center;justify-content:center;gap:12px;min-height:2.2em;
      max-width:820px;font-size:1.15rem;text-align:center;color:var(--muted);
      transition:opacity .4s;
    }
    .tablefact.fade{opacity:0}
    .tablefact .ic{font-size:1.4rem;line-height:1}
    .tablefact b{color:var(--text);font-weight:700}

    /* ---- feestjes ----------------------------------------------------
       Puur versiering. Elk effect hangt aan het VERSCHIL tussen twee
       snapshots (zie fxDiff), nooit aan de stand zelf — anders zou elke
       draft-POST de boel opnieuw laten knallen. */
    #fx{
      position:fixed;top:0;left:0;width:100vw;height:100vh;
      overflow:hidden;pointer-events:none;z-index:60;
    }
    /* Eén deeltje = buitenste span (x-drift + fade) met daarin een <i>
       (boog omhoog-omlaag). Twee lagen, want één transform kan niet
       tegelijk lineair opzij en met zwaartekracht omlaag. */
    #fx .p{position:absolute;animation:fx-x var(--dur) linear forwards,fx-fade var(--dur) linear forwards}
    #fx .p i{
      display:block;font-style:normal;line-height:1;font-size:var(--sz);
      animation:fx-y var(--dur) forwards;
    }
    @keyframes fx-x{
      from{transform:translate(-50%,-50%) rotate(0deg)}
      to{transform:translate(calc(-50% + var(--dx)),-50%) rotate(var(--rot))}
    }
    @keyframes fx-fade{0%,65%{opacity:1}100%{opacity:0}}
    @keyframes fx-y{
      0%{transform:translateY(0) scale(.5);animation-timing-function:cubic-bezier(.1,.75,.35,1)}
      45%{transform:translateY(var(--rise)) scale(1);animation-timing-function:cubic-bezier(.45,0,.75,.6)}
      100%{transform:translateY(var(--fall)) scale(.9)}
    }
    /* Regen: van boven het scherm naar beneden, met een zwaai erin. */
    #fx .r{position:absolute;top:-10vh;animation:fx-fall var(--dur) linear both}
    #fx .r i{
      display:block;font-style:normal;line-height:1;font-size:var(--sz);
      animation:fx-sway calc(var(--dur)/3) ease-in-out infinite alternate;
    }
    @keyframes fx-fall{
      0%{transform:translateY(0) rotate(0deg);opacity:0}
      6%{opacity:1}
      92%{opacity:1}
      100%{transform:translateY(120vh) rotate(var(--rot));opacity:0}
    }
    @keyframes fx-sway{from{transform:translateX(calc(var(--sway) * -1))}to{transform:translateX(var(--sway))}}

    /* Schermschud bij een dikke score. */
    body.fx-shake{animation:fx-shake .5s cubic-bezier(.36,.07,.19,.97)}
    @keyframes fx-shake{
      0%,100%{transform:translate(0,0)}
      12%{transform:translate(-9px,4px)}
      26%{transform:translate(8px,-5px)}
      40%{transform:translate(-7px,-3px)}
      55%{transform:translate(6px,4px)}
      70%{transform:translate(-4px,-2px)}
      85%{transform:translate(3px,1px)}
    }

    /* Binnenknallen: van ver weg en onscherp naar op z'n plek, met een
       tikje doorschieten. fx-pop is de lichte variant. */
    @keyframes fx-slam{
      0%{transform:scale(3.4);opacity:0;filter:blur(7px)}
      55%{transform:scale(.84);opacity:1;filter:blur(0)}
      74%{transform:scale(1.12)}
      100%{transform:scale(1);filter:blur(0)}
    }
    @keyframes fx-pop{
      0%{transform:scale(.35);opacity:0}
      60%{transform:scale(1.22);opacity:1}
      100%{transform:scale(1)}
    }
    @keyframes fx-jolt{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-8px)}
      40%{transform:translateX(7px)}
      60%{transform:translateX(-5px)}
      80%{transform:translateX(3px)}
    }
    /* De ring die van de kaart af golft; --fxc kleurt hem naar de score. */
    @keyframes fx-ring{
      0%{transform:scale(1);opacity:.85}
      100%{transform:scale(1.3);opacity:0}
    }
    @keyframes fx-glow{
      0%{box-shadow:0 0 0 0 var(--fxc)}
      40%{box-shadow:0 0 34px 6px var(--fxc)}
      100%{box-shadow:0 0 0 0 transparent}
    }

    /* De score van de zojuist getelde ronde, op de kaart. Per speler een
       eigen vertraging (--fxd) zodat ze na elkaar binnenkomen. */
    .pcard.fx-hit .stat span{display:inline-block;animation:fx-pop .5s cubic-bezier(.2,1.5,.4,1) var(--fxd,0s) backwards}
    .pcard.fx-bid .tot,.pcard.fx-trick .stat span{
      display:inline-block;animation:fx-pop .45s cubic-bezier(.2,1.5,.4,1) backwards;
    }
    .pcard.fx-hit .tot{display:inline-block;animation:fx-pop .45s cubic-bezier(.2,1.5,.4,1) var(--fxd,0s) backwards}
    .pcard.fx-slam .stat span{animation:fx-slam .65s cubic-bezier(.2,.9,.3,1) var(--fxd,0s) backwards}
    .pcard.fx-hit{animation:fx-glow 1s ease-out var(--fxd,0s) backwards}
    .pcard.fx-jolt{animation:fx-jolt .45s ease-out var(--fxd,0s) backwards}
    .pcard.fx-hit::after{
      content:'';position:absolute;inset:-1px;border-radius:16px;pointer-events:none;
      border:3px solid var(--fxc);animation:fx-ring .8s ease-out var(--fxd,0s) backwards;
    }
    /* De kroon die neervalt bij een kopwissel. */
    .pcard .crown.fx-crown{animation:fx-drop .7s cubic-bezier(.2,1.6,.35,1) backwards}
    @keyframes fx-drop{
      0%{transform:translate(-50%,-90px) scale(.4) rotate(-35deg);opacity:0}
      60%{transform:translate(-50%,4px) scale(1.25) rotate(6deg);opacity:1}
      100%{transform:translate(-50%,0) scale(1) rotate(0deg)}
    }

    /* "Samen gevraagd": het getal springt bij elke wijziging, en de hele
       balk schudt als het precies rond uitkomt (dan gaat er niemand nat). */
    .askbar .num.fx-bump{display:inline-block;animation:fx-pop .35s cubic-bezier(.2,1.5,.4,1)}
    .askbar.fx-jolt{animation:fx-jolt .5s ease-out}

    /* Nieuwe rij in de scoretabel: even oplichten, cijfers na elkaar erin. */
    tr.fx-row{animation:fx-rowflash 1.3s ease-out}
    @keyframes fx-rowflash{
      0%{background:rgba(255,214,0,.4)}
      35%{background:rgba(255,214,0,.22)}
      100%{background:var(--accent-dim)}
    }
    tr.fx-row td .d{display:block;animation:fx-pop .4s cubic-bezier(.2,1.5,.4,1) var(--fxd,0s) backwards}
    /* De verlooplijnen tekenen zichzelf na (JS zet de dash-lengte). */
    .trend svg polyline.fx-draw{transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.4,1)}

    /* Winnaarscherm. */
    .winner-banner{animation:fx-banner .8s cubic-bezier(.2,1.3,.35,1) backwards}
    @keyframes fx-banner{
      0%{transform:scale(.6);opacity:0}
      60%{transform:scale(1.06);opacity:1}
      100%{transform:scale(1)}
    }
    .winner-banner .trophy{display:inline-block;animation:fx-trophy 1.4s ease-in-out .5s both}
    @keyframes fx-trophy{
      0%{transform:translateY(-120px) scale(.4) rotate(-25deg);opacity:0}
      35%{transform:translateY(0) scale(1.2) rotate(8deg);opacity:1}
      50%{transform:translateY(-14px) scale(1) rotate(-5deg)}
      65%{transform:translateY(0) scale(1.05) rotate(3deg)}
      80%{transform:translateY(-6px) scale(1)}
      100%{transform:translateY(0) scale(1) rotate(0deg)}
    }
    .winner-banner .name{animation:fx-slam .7s cubic-bezier(.2,.9,.3,1) .35s backwards}
    .winner-banner .score,.center .standings{animation:fx-rise .6s ease-out .8s backwards}
    .highlights .hl{animation:fx-rise .5s ease-out var(--fxd,0s) backwards}
    @keyframes fx-rise{
      0%{transform:translateY(14px);opacity:0}
      100%{transform:translateY(0);opacity:1}
    }

    /* Wie dit niet wil, krijgt het niet. JS kijkt naar dezelfde query en
       laat de deeltjes dan helemaal achterwege. */
    @media(prefers-reduced-motion:reduce){
      #fx{display:none}
      body.fx-shake,.pcard.fx-hit,.pcard.fx-jolt,.pcard.fx-hit .stat span,.pcard.fx-slam .stat span,
      .pcard.fx-hit .tot,.pcard.fx-bid .tot,.pcard.fx-trick .stat span,.pcard .crown.fx-crown,
      .askbar .num.fx-bump,.askbar.fx-jolt,tr.fx-row,tr.fx-row td .d,
      .winner-banner,.winner-banner .trophy,.winner-banner .name,.winner-banner .score,
      .center .standings,.highlights .hl{animation:none}
      .pcard.fx-hit::after{display:none}
      .trend svg polyline.fx-draw{transition:none}
    }

    @media(max-width:700px){
      .highlights{grid-template-columns:1fr;font-size:1rem}
      .factbar{font-size:1.05rem;padding:10px 14px}
      .topbar{flex-direction:column;gap:6px}
      .topbar .dealer,.topbar .round{text-align:center}
      .pcard .tot{font-size:1.9rem}
      .askbar .num{font-size:3.5rem}
      .askbar .num .of{font-size:1.5rem}
      .askbar .delta{font-size:1.1rem}
    }
  </style>
</head>
<body>
  <div id="connDot" title="Verbinding met de server"></div>
  <div id="app"></div>
  <div id="fx" aria-hidden="true"></div>

<script>
(function(){
  const API = '../../../api/boerenbridge';
  const app = document.getElementById('app');
  const dot = document.getElementById('connDot');
  let lastEventAt = 0;
  let source = null;

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  // De server classificeert elke score ('exact' | 'over' | 'under'); wij kleuren alleen.
  function kcls(k){return k?' class="k-'+k+'"':''}
  const SUITS=['♣','♥','♦','♠','Sans'];
  // Vaste spelerkleuren: dezelfde kleur bij de naam op de kaart en in de grafiek.
  // Lijnkleuren voor de verloopgrafiek. Alleen daar doet spelerkleur werk: op de
  // kaarten en in de tabel staat de naam er al naast. Bewust geen groen/oranje/
  // rood/goud uit de betekeniskleuren - kleur betekent hier 'wie', niet 'hoe'.
  const PCOLORS=['#3987e5','#d95926','#199e70','#c98500','#d55181','#9085e9'];
  const ORD=['1e','2e','3e','4e','5e','6e'];
  const sign=v=>(v>0?'+':'')+v;

  // ---- feestjes ----
  // De schermen worden bij élke snapshot compleet opnieuw opgebouwd. Een
  // animatie die aan de stand hangt zou dus bij elke aangetikte voorspelling
  // opnieuw starten. Daarom: onthoud een samenvatting van de vorige snapshot
  // (fxPrev), leid uit het verschil af wát er nieuw is (fxDiff) en speel dat
  // ná het renderen af (fxPlay). Bij de eerste snapshot na het laden gebeurt
  // er niets — anders gaf herladen op het winnaarscherm telkens confetti.
  const fxBox=document.getElementById('fx');
  const noMotion=window.matchMedia
    ? window.matchMedia('(prefers-reduced-motion:reduce)') : {matches:false};
  const FXC={exact:'#4caf50',over:'#ff9800',under:'#e53935'};
  const FXE={
    exact:['🎯','✨','⭐','💚'],
    big:['🎉','🎊','💥','⭐','🔥'],
    under:['💥','🙈','📉','😵'],
    zero:['😇','🫥','🧘'],
    crown:['👑','✨','🌟'],
    all:['🤯','🎯','🎉'],
    none:['🫠','😬','💀'],
    max:['🔥','🚀','😤'],
    win:['🏆','🎉','🎊','🥳','✨','🌟','🃏','🎈'],
  };
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const pick=a=>a[Math.floor(Math.random()*a.length)];

  // Eén deeltje = buitenste span (drift opzij + fade) met daarin een <i> die
  // de boog omhoog-omlaag doet; samen geeft dat zwaartekracht.
  function burst(x,y,emojis,count,opt){
    if(noMotion.matches||!emojis||!emojis.length) return;
    const o=opt||{}, spread=o.spread||220, rise=o.rise||-170, fall=o.fall||420;
    for(let k=0;k<count;k++){
      if(fxBox.childElementCount>180) return; // nooit het scherm dichtgooien
      const el=document.createElement('span');
      el.className='p';
      el.style.left=Math.round(x)+'px';
      el.style.top=Math.round(y)+'px';
      el.style.setProperty('--dx',Math.round(rnd(-spread,spread))+'px');
      el.style.setProperty('--rise',Math.round(rnd(rise*1.4,rise*0.5))+'px');
      el.style.setProperty('--fall',Math.round(rnd(fall*0.6,fall*1.3))+'px');
      el.style.setProperty('--rot',Math.round(rnd(-420,420))+'deg');
      el.style.setProperty('--sz',rnd(1.5,2.8).toFixed(2)+'rem');
      el.style.setProperty('--dur',rnd(1.3,2.1).toFixed(2)+'s');
      el.innerHTML='<i>'+pick(emojis)+'</i>';
      el.addEventListener('animationend',e=>{ if(e.target===el) el.remove(); });
      fxBox.appendChild(el);
    }
  }

  // Uitbarsting vanaf een element; kan later afgaan dan het renderen, dus
  // eerst kijken of het nog in beeld staat.
  function burstFrom(el,emojis,count,opt){
    if(!el||!el.isConnected) return;
    const r=el.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height*0.45,emojis,count,opt);
  }

  // Regen over de volle breedte, voor de momenten die het hele scherm raken.
  function rain(emojis,count,opt){
    if(noMotion.matches||!emojis||!emojis.length) return;
    const o=opt||{}, dur=o.dur||4.5, spreadIn=o.delay||2.5;
    for(let k=0;k<count;k++){
      if(fxBox.childElementCount>180) return;
      const el=document.createElement('span');
      el.className='r';
      el.style.left=rnd(-2,100).toFixed(1)+'%';
      el.style.setProperty('--rot',Math.round(rnd(-540,540))+'deg');
      el.style.setProperty('--sz',rnd(1.4,2.6).toFixed(2)+'rem');
      el.style.setProperty('--sway',Math.round(rnd(14,46))+'px');
      el.style.setProperty('--dur',rnd(dur*0.7,dur*1.3).toFixed(2)+'s');
      el.style.animationDelay=rnd(0,spreadIn).toFixed(2)+'s';
      el.innerHTML='<i>'+pick(emojis)+'</i>';
      el.addEventListener('animationend',e=>{ if(e.target===el) el.remove(); });
      fxBox.appendChild(el);
    }
  }

  let shakeTimer=null;
  function shakeScreen(){
    if(noMotion.matches) return;
    document.body.classList.remove('fx-shake');
    void document.body.offsetWidth; // forceer herstart van de animatie
    document.body.classList.add('fx-shake');
    clearTimeout(shakeTimer);
    shakeTimer=setTimeout(()=>document.body.classList.remove('fx-shake'),600);
  }

  // Samenvatting van een snapshot: precies genoeg om te zien wat er nieuw is.
  function fxState(g){
    if(!g) return null;
    const d=g.draft, live=d&&d.phase===g.phase?d.values:null;
    const vals=live?live.slice():g.players.map(()=>null);
    return {
      id:g.id,
      status:g.status,
      played:g.roundScores.length,
      phase:g.phase,
      round:g.currentRound,
      leaders:(g.positions||[]).map((p,i)=>p===1?i:-1).filter(i=>i>=0).join(','),
      draft:vals,
      ask:vals.reduce((a,v)=>a+(v||0),0),
      missing:vals.filter(v=>v==null).length,
    };
  }

  function fxDiff(prev,g){
    const out=[];
    const now=fxState(g);
    if(!g||!prev||!now||prev.id!==g.id) return out; // eerste snapshot of ander potje
    if(prev.status!=='finished'&&g.status==='finished'){ out.push({t:'win'}); return out; }
    if(g.status!=='active') return out;
    if(now.played<prev.played) return out;         // undo: niets te vieren
    if(now.played>prev.played){
      const r=now.played-1;
      let exact=0;
      g.players.forEach((_,i)=>{
        const kind=g.roundKinds[r][i];
        if(kind==='exact') exact++;
        out.push({t:'round',seat:i,kind:kind,score:g.roundScores[r][i],
                  pred:g.predictions[r][i],act:g.actuals[r][i]});
      });
      out.push({t:'roundAll',exact:exact,n:g.players.length});
      // De stand verandert alleen als er geteld is, dus een kopwissel hoort hier.
      if(now.leaders!==prev.leaders){
        now.leaders.split(',').filter(s=>s!=='').forEach(s=>out.push({t:'lead',seat:+s}));
      }
      return out;
    }
    // Concept-invoer: reageer op elke nieuwe of gewijzigde keuze.
    if(prev.round===now.round&&prev.phase===now.phase){
      const cards=g.roundInfo.cards;
      now.draft.forEach((v,i)=>{
        if(v==null||v===prev.draft[i]) return;
        out.push({t:now.phase==='predict'?'bid':'trick',seat:i,value:v,cards:cards});
      });
      if(now.phase==='predict'&&now.ask!==prev.ask) out.push({t:'ask'});
      if(now.phase==='predict'&&!now.missing&&now.ask===cards
         &&(prev.missing||prev.ask!==cards)) out.push({t:'askJolt'});
    }
    return out;
  }

  function fxPlay(effects){
    if(!effects.length) return;
    const cards=app.querySelectorAll('.pcard');
    let shakeAt=-1;
    effects.forEach(e=>{
      const card=cards[e.seat];
      if(e.t==='win'){
        rain(FXE.win,46,{dur:5.5,delay:3.5});
        shakeScreen();
        setTimeout(()=>burstFrom(app.querySelector('.winner-banner'),FXE.win,22,
          {spread:340,rise:-260,fall:560}),700);
        return;
      }
      if(e.t==='round'){
        if(!card) return;
        const wait=e.seat*0.09;
        card.style.setProperty('--fxd',wait.toFixed(2)+'s');
        card.style.setProperty('--fxc',FXC[e.kind]||'#9a9aa3');
        card.classList.add('fx-hit');
        const zero=e.pred===0&&e.act===0;
        let emo=zero?FXE.zero:e.kind==='exact'?FXE.exact:e.kind==='under'?FXE.under:null;
        let n=zero?8:e.kind==='exact'?9:e.kind==='under'?7:0;
        let opt={spread:170,rise:-170,fall:400};
        if(e.kind==='under'){ opt={spread:130,rise:-70,fall:520}; card.classList.add('fx-jolt'); }
        if(e.score>=8){ // een dikke score knalt binnen, met schokgolf en al
          card.classList.add('fx-slam');
          emo=FXE.big; n=e.score>=10?18:12; opt={spread:280,rise:-240,fall:560};
          // Schudden is voor de echt grote klappers; anders went het te snel.
          if(e.score>=10&&e.seat>shakeAt) shakeAt=e.seat;
        }
        if(emo) setTimeout(()=>burstFrom(card,emo,n,opt),wait*1000+140);
        return;
      }
      if(e.t==='roundAll'){
        if(e.n>=2&&e.exact===e.n) rain(FXE.all,26,{dur:4,delay:1.6});
        else if(!e.exact) rain(FXE.none,10,{dur:4.5,delay:2});
        return;
      }
      if(e.t==='lead'){
        if(!card) return;
        const crown=card.querySelector('.crown');
        if(crown) crown.classList.add('fx-crown');
        setTimeout(()=>burstFrom(crown||card,FXE.crown,10,
          {spread:150,rise:-160,fall:320}),300);
        return;
      }
      if(e.t==='bid'||e.t==='trick'){
        if(!card) return;
        card.classList.add(e.t==='bid'?'fx-bid':'fx-trick');
        // Alles vragen is een statement; dat mag gezien worden.
        if(e.t==='bid'&&e.cards>=3&&e.value===e.cards){
          setTimeout(()=>burstFrom(card,FXE.max,10,{spread:150,rise:-180,fall:340}),60);
        }
        return;
      }
      if(e.t==='ask'){
        const num=app.querySelector('.askbar .num');
        if(num) num.classList.add('fx-bump');
        return;
      }
      if(e.t==='askJolt'){
        const bar=app.querySelector('.askbar');
        if(bar) bar.classList.add('fx-jolt');
      }
    });
    if(shakeAt>=0) setTimeout(shakeScreen,shakeAt*90+170);
    // De net getelde ronde licht op in de tabel en de lijnen tekenen zich na.
    if(effects.some(e=>e.t==='round')){ fxRow(); fxTrend(); }
  }

  function fxRow(){
    const row=app.querySelector('tr.current-round');
    if(!row) return;
    row.classList.add('fx-row');
    row.querySelectorAll('td .d').forEach((d,k)=>d.style.setProperty('--fxd',(k*0.06).toFixed(2)+'s'));
  }

  function fxTrend(){
    if(noMotion.matches) return;
    app.querySelectorAll('.trend svg polyline').forEach(pl=>{
      if(typeof pl.getTotalLength!=='function') return;
      let len=0;
      try{ len=pl.getTotalLength(); }catch(err){ return; }
      if(!len) return;
      pl.style.strokeDasharray=len;
      pl.style.strokeDashoffset=len;
      pl.classList.add('fx-draw');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ pl.style.strokeDashoffset=0; }));
    });
  }

  // ---- renderen ----
  // Vier schermen: voorspellen (draft-invoer loopt) → spelen (voorspellingen
  // bevestigd) → tussenstand (ronde geteld, nog geen nieuwe invoer) → eindstand.
  let lastGame=null, fxPrev=null;
  function render(snapshot){
    const g = snapshot.game;
    // Eerst kijken wát er nieuw is (het scherm staat er dan nog), daarna pas
    // opnieuw opbouwen; de effecten hangen aan het verschil, niet aan de stand.
    const effects = fxDiff(fxPrev, g);
    fxPrev = fxState(g);
    lastGame=g;
    app.style.display='contents';
    if(g&&factTimer){ clearInterval(factTimer); factTimer=null; }
    if(!g) renderIdle(snapshot.leaderboard, snapshot.awards, snapshot.tableFacts);
    else if(g.status==='finished') renderWinner(g);
    else{
      const d=g.draft;
      if(g.phase==='predict'&&d&&d.phase==='predict'&&d.values.some(v=>v!=null)) renderBidding(g,d);
      else if(g.phase==='actual') renderPlaying(g, d&&d.phase==='actual'?d:null);
      else renderStandings(g);
    }
    fxPlay(effects);
  }

  function topbarHtml(g,label){
    const ri=g.roundInfo;
    return '<div class="topbar">'
      +'<div class="trump"><span class="suit" style="color:'+ri.suitColor+'">'+ri.suit+'</span>'
      +'<span class="txt"><span class="big">'+esc(ri.suitName)+' · '+ri.cards+' kaarten</span><br>'
      +'<span class="small">'+label+'</span></span></div>'
      +'<div class="round">Ronde '+(g.currentRound+1)+' / '+g.rounds.length+'</div>'
      +'<div class="dealer">Deler: '+esc(g.players[g.dealerIdx])+'</div>'
      +'</div>';
  }

  // cell(i) → {main, stat, sub?, lab?, cls?, crown?}
  function pcardsHtml(g, cell){
    const ranked=g.roundScores.length>0; // vóór ronde 1 staat iedereen op 0
    const n=g.players.length, cap=n*340+(n-1)*12;
    let html='<div class="players" style="grid-template-columns:repeat('+n+',minmax(0,1fr));max-width:'+cap+'px">';
    g.players.forEach((p,i)=>{
      const c=cell(i);
      html+='<div class="pcard'+(c.cls||'')+'">'
        +(c.crown?'<span class="crown">👑</span>':'')
        +(ranked?'<span class="rank">'+ORD[(g.positions[i]||1)-1]+'</span>':'')
        +'<span class="nm"><span class="who">'+esc(p)+'</span>'
          +(i===g.dealerIdx?'<span class="dealerdot">●</span>':'')+'</span>'
        +(c.lab?'<span class="lab">'+c.lab+'</span>':'')
        +'<span class="tot">'+c.main+'</span>'
        +'<span class="stat">'+c.stat+'</span>'
        +'<span class="sub">'+(c.sub||'')+'</span>'
        +'</div>';
    });
    return html+'</div>';
  }

  // Tweede regel op de kaart: altijd de stand van dat moment. Loopt er
  // slagen-invoer, dan erachter waar die stand op uitkomt (server-projectie).
  function standSub(g,i){
    const pr=g.projection, d=pr?pr.deltas[i]:null;
    if(d==null) return '<b>'+g.totals[i]+'</b> pt';
    return '<b>'+g.totals[i]+'</b><span class="arrow">→</span>'
      +'<span'+kcls(pr.kinds[i])+'>'+pr.totals[i]+'</span> pt';
  }

  function askbarHtml(g,total,cards,delta){
    return '<div class="fillcenter"><div class="livewrap"><div class="askbar">'
      +'<div class="lbl">Samen gevraagd</div>'
      +'<div class="num">'+total+'<span class="of"> van '+cards+'</span></div>'
      +'<div class="delta '+delta.cls+'">'+delta.txt+'</div>'
      +'</div>'+trendHtml(g)+'</div></div>';
  }

  function deltaInfo(total,cards){
    if(total>cards) return {cls:'over',txt:(total-cards)+' te veel — er gaat iemand de boot in'};
    if(total<cards) return {cls:'under',txt:(cards-total)+' te weinig — er blijven slagen over'};
    return {cls:'even',txt:'precies rond'};
  }

  // Weetje voor de komende ronde; per ronde vastgepind door de server, dus
  // op het tussen-, voorspel- en speelscherm dezelfde regel.
  // `preferDraft`: tijdens het voorspellen gaat de reactie op de zojuist
  // aangetikte keuze voor op het weetje van de ronde.
  function factHtml(g,preferDraft){
    const f=(preferDraft&&g.draftFact)||g.fact;
    if(!f) return '';
    return '<div class="factbar"><span class="ic">'+f.icon+'</span><span>'+esc(f.text)+'</span></div>';
  }

  function highlightsHtml(g){
    const hl=g.highlights||[];
    if(!hl.length) return '';
    return '<div class="highlights">'+hl.map((h,i)=>
      '<div class="hl" style="--fxd:'+(0.9+i*0.09).toFixed(2)+'s"><span class="ic">'+h.icon+'</span>'
      +'<span>'+esc(h.text)+'</span></div>').join('')+'</div>';
  }

  // Scherm 1: voorspellen — live meekijken met de invoer op de telefoon.
  function renderBidding(g,draft){
    const cards=g.roundInfo.cards;
    const vals=draft.values;
    const total=vals.reduce((a,v)=>a+(v||0),0);
    const missing=vals.filter(v=>v==null).length;
    const delta=missing
      ? {cls:'wait',txt:'nog '+missing+(missing===1?' speler moet':' spelers moeten')+' voorspellen'}
      : deltaInfo(total,cards);
    app.innerHTML=topbarHtml(g,'Voorspellen')
      +pcardsHtml(g,i=>({
        lab:'vraagt',
        main: vals[i]!=null?vals[i]:'<span class="unknown">?</span>',
        stat: lastRoundStat(g,i),
        sub: standSub(g,i),
        cls: vals[i]!=null?' chosen':'',
      }))
      +factHtml(g,true)+askbarHtml(g,total,cards,delta);
    drawTrend(g);
  }

  // Scherm 2: tijdens het kaarten — ieders voorspelling + samen gevraagd,
  // en zodra de slagen-invoer loopt live wie wat gehaald heeft.
  function renderPlaying(g,draft){
    const cards=g.roundInfo.cards;
    const preds=g.predictions[g.currentRound];
    const total=preds.reduce((a,b)=>a+b,0);
    app.innerHTML=topbarHtml(g,'Spelen')
      +pcardsHtml(g,i=>{
        const got=draft?draft.values[i]:null;
        return {
          lab:'gevraagd',
          main: preds[i],
          stat: got!=null
            ? 'gehaald: <span'+kcls(g.projection?g.projection.kinds[i]:null)+'>'+got+'</span>'
            : 'gehaald: <span class="unknown">–</span>',
          sub: standSub(g,i),
        };
      })
      +factHtml(g)+askbarHtml(g,total,cards,deltaInfo(total,cards));
    drawTrend(g);
  }

  // Score van de vorige ronde — op elk scherm dezelfde formulering.
  function lastRoundStat(g,i){
    if(!g.roundScores.length) return 'nog geen ronde gespeeld';
    const last=g.roundScores[g.roundScores.length-1][i];
    return 'vorige ronde: <span'+kcls(g.roundKinds[g.roundKinds.length-1][i])+'>'+sign(last)+'</span>';
  }

  // Scherm 3: tussenstand — na de telling, tot de eerste nieuwe voorspelling.
  function renderStandings(g){
    const leaderMax=Math.max(...g.totals);
    const hasScores=g.roundScores.length>0;
    let html=topbarHtml(g,'Voorspellen')
      +pcardsHtml(g,i=>{
        const isLeader=hasScores&&g.totals[i]===leaderMax;
        return {
          main:g.totals[i],
          stat:hasScores?lastRoundStat(g,i):'wacht op voorspellingen…',
          sub:hasScores?(isLeader?'aan kop':(leaderMax-g.totals[i])+' achter'):'',
          cls:isLeader?' leader':'',
          crown:isLeader,
        };
      });
    html+=factHtml(g)+'<div class="boardwrap"><div class="scoreboard"><table>'+scoreTableHtml(g)+'</table></div>'
      +trendHtml(g)+'</div>';
    app.innerHTML=html;
    drawTrend(g);
    // nieuwste ronde in beeld houden
    const sb=app.querySelector('.scoreboard');
    if(sb) sb.scrollTop=sb.scrollHeight;
  }

  // Elke cel: de puntenwijziging van die ronde (groot) met daaronder de stand
  // op dat moment (g.cumulative van de server) — de tussenstand blijft dus in
  // beeld, niet alleen de plus of min.
  function scoreTableHtml(g){
    let html='<thead><tr><th>Ronde</th>';
    g.players.forEach((p,i)=>{
      html+='<th>'+esc(p)+'</th>';
    });
    html+='</tr></thead><tbody>';
    for(let r=0;r<g.roundScores.length;r++){
      const rd=g.rounds[r];
      const rowCls=r===g.roundScores.length-1?' class="current-round"':'';
      html+='<tr'+rowCls+'><td>'+SUITS[rd.suitIdx]+' '+rd.cards+'</td>';
      g.roundScores[r].forEach((s,i)=>{
        html+='<td'+kcls(g.roundKinds[r][i])+'><span class="d">'+sign(s)+'</span>'
          +'<span class="c">'+g.cumulative[r][i]+'</span></td>';
      });
      html+='</tr>';
    }
    html+='</tbody><tfoot><tr><td>Totaal</td>';
    g.totals.forEach((t,i)=>{
      const top=g.roundScores.length&&g.positions[i]===1;
      html+='<td class="'+(top?'top':'')+'"><span class="d">'+t+'</span>'
        +'<span class="c">'+(g.roundScores.length?ORD[g.positions[i]-1]:'')+'</span></td>';
    });
    return html+'</tr></tfoot>';
  }

  // ---- verloopgrafiek ----
  // Eén lijn per speler over de gespeelde rondes (0 = start). Loopt er
  // slagen-invoer, dan wordt de lijn gestippeld doorgetrokken naar de
  // projectie die de server meestuurt.
  // De SVG wordt pas ná het invoegen getekend: dan is de beschikbare ruimte
  // bekend en kan hij die exact vullen (geen letterboxing, geen vervorming).
  function trendHtml(g){
    if(!(g.cumulative||[]).length) return ''; // vóór ronde 1 valt er niets te tekenen
    return '<div class="trend"><h3>Verloop van de stand'
      +(liveProjection(g)?' · stippellijn = als dit klopt':'')+'</h3><div class="canvas"></div></div>';
  }

  function liveProjection(g){
    return g.projection&&g.projection.deltas.some(d=>d!=null)?g.projection:null;
  }

  // Hulplijnen op ronde waarden: 1, 2, 5, 10, 20, 50, …
  function niceStep(range){
    const raw=(range||1)/4;
    const mag=Math.pow(10,Math.floor(Math.log10(raw)));
    const n=raw/mag;
    return (n<=1?1:n<=2?2:n<=5?5:10)*mag;
  }

  function drawTrend(g){
    const box=app.querySelector('.trend .canvas');
    if(!box||!g||!(g.cumulative||[]).length) return;
    const W=Math.round(box.clientWidth), H=Math.round(box.clientHeight);
    if(W<120||H<80) return;
    box.innerHTML=trendSvg(g,W,H);
  }

  function trendSvg(g,W,H){
    const cum=g.cumulative, pr=liveProjection(g);
    const series=g.players.map((_,i)=>[0].concat(cum.map(row=>row[i])));
    const endVals=g.players.map((_,i)=>pr?pr.totals[i]:series[i][series[i].length-1]);
    const labels=g.players.map((p,i)=>p+' '+endVals[i]);
    const F=Math.max(11,Math.min(17,Math.round(H/24)));      // schaalt mee met het paneel
    const ML=Math.round(F*2.8);
    const MR=Math.min(Math.round(W*0.42), Math.round(labels.reduce((a,l)=>Math.max(a,l.length),0)*F*0.62)+22);
    const MT=Math.round(F*0.9), MB=Math.round(F*2.1);
    const steps=cum.length+(pr?1:0);
    const vals=series.reduce((a,ser)=>a.concat(ser),[]).concat(pr?pr.totals:[]);
    let lo=Math.min(0,...vals), hi=Math.max(0,...vals);
    if(hi-lo<1) hi=lo+1;
    const pad=(hi-lo)*0.1; lo-=pad; hi+=pad;
    const X=k=>ML+(W-ML-MR)*(k/steps);
    const Y=v=>MT+(H-MT-MB)*(1-(v-lo)/(hi-lo));
    const n=v=>Math.round(v*10)/10;

    let svg='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
    const step=niceStep(hi-lo);
    for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){
      const zero=Math.abs(v)<1e-9, y=n(Y(v));
      svg+='<line x1="'+ML+'" y1="'+y+'" x2="'+n(W-MR)+'" y2="'+y+'" stroke="'+(zero?'#4a4a55':'#2e2e36')+'" '
        +'stroke-width="'+(zero?2:1)+'"'+(zero?'':' stroke-dasharray="4 6"')+'/>'
        +'<text x="'+(ML-8)+'" y="'+n(y+F*0.35)+'" fill="#9a9aa3" font-size="'+F+'" text-anchor="end">'
        +Math.round(v)+'</text>';
    }
    // rondenummers; bij weinig ruimte om de ronde
    const every=(W-ML-MR)/steps<F*2?2:1;
    for(let k=1;k<=cum.length;k++){
      if(k%every&&k!==cum.length) continue;
      svg+='<text x="'+n(X(k))+'" y="'+n(H-MB+F*1.3)+'" fill="#9a9aa3" font-size="'+F+'" '
        +'text-anchor="middle">'+k+'</text>';
    }
    if(pr){
      svg+='<text x="'+n(X(steps))+'" y="'+n(H-MB+F*1.3)+'" fill="#6f6f78" font-size="'+F+'" '
        +'text-anchor="middle">nu</text>';
    }
    g.players.forEach((p,i)=>{
      const col=PCOLORS[i%PCOLORS.length];
      const pts=series[i].map((v,k)=>n(X(k))+','+n(Y(v))).join(' ');
      const lastY=n(Y(series[i][series[i].length-1]));
      svg+='<polyline fill="none" stroke="'+col+'" stroke-width="3" stroke-linejoin="round" '
        +'stroke-linecap="round" points="'+pts+'"/>'
        +'<circle cx="'+n(X(cum.length))+'" cy="'+lastY+'" r="4.5" fill="'+col+'"/>';
      if(pr){
        svg+='<line x1="'+n(X(cum.length))+'" y1="'+lastY+'" x2="'+n(X(steps))+'" y2="'+n(Y(pr.totals[i]))+'" '
          +'stroke="'+col+'" stroke-width="2.5" stroke-dasharray="6 5" opacity=".85"/>'
          +'<circle cx="'+n(X(steps))+'" cy="'+n(Y(pr.totals[i]))+'" r="4.5" fill="none" stroke="'+col+'" stroke-width="2.5"/>';
      }
    });
    // naamlabels rechts, uit elkaar geduwd zodat ze niet overlappen
    const labs=g.players.map((p,i)=>({i,y:Y(endVals[i])})).sort((a,b)=>a.y-b.y);
    const GAP=F*1.35;
    for(let k=1;k<labs.length;k++) if(labs[k].y-labs[k-1].y<GAP) labs[k].y=labs[k-1].y+GAP;
    const over=labs.length?labs[labs.length-1].y-(H-MB):0;
    if(over>0) labs.forEach(l=>{l.y-=over;});
    labs.forEach(l=>{
      svg+='<text x="'+n(W-MR+10)+'" y="'+n(l.y+F*0.35)+'" fill="var(--text)" '
        +'font-size="'+n(F*1.05)+'" font-weight="700">'+esc(labels[l.i])+'</text>';
    });
    return svg+'</svg>';
  }

  function renderWinner(g){
    const names=g.winnerIdxs.map(i=>esc(g.players[i])).join(' & ');
    const max=Math.max(...g.totals);
    const order=g.players.map((p,i)=>({p,t:g.totals[i]})).sort((a,b)=>b.t-a.t);
    const standings=order.map((e,i)=>(i+1)+'. <b>'+esc(e.p)+'</b> ('+e.t+')').join(' &nbsp;·&nbsp; ');
    app.innerHTML='<div class="center">'
      +'<div class="winner-banner"><div class="trophy">🏆</div>'
      +'<div class="name">'+names+(g.winnerIdxs.length>1?' winnen!':' wint!')+'</div>'
      +'<div class="score">'+max+' punten</div></div>'
      +'<div class="standings">'+standings+'</div>'
      +(g.counted===false?'<div class="standings">Dit potje telt niet mee voor het klassement</div>':'')
      +highlightsHtml(g)
      +'</div>';
  }

  function awardsHtml(awards){
    if(!awards||!awards.length) return '';
    return '<div class="awards">'+awards.map(a=>
      '<span>'+a.icon+' '+esc(a.title)+': <b>'
      +a.winners.map(w=>esc(w.name)+' ('+esc(w.detail)+')').join(', ')+'</b></span>').join('')+'</div>';
  }

  function renderIdle(leaderboard, awards, tableFacts){
    let lb='';
    if(leaderboard&&leaderboard.length){
      lb='<div class="lb-panel"><h2>🏆 Klassement</h2><table>'
        +'<thead><tr><th>Speler</th><th>Potjes</th><th>Gewonnen</th><th>Gem. punten</th><th>Beste score</th><th>Precies</th></tr></thead><tbody>';
      leaderboard.forEach(e=>{
        lb+='<tr><td>'+esc(e.name)+'</td><td>'+e.gamesPlayed+'</td><td>'+e.wins+'</td><td>'+e.avgPoints+'</td><td>'+e.bestScore+'</td><td>'+e.exactPct+'%</td></tr>';
      });
      lb+='</tbody></table>'+awardsHtml(awards)+'</div>';
    }
    app.innerHTML='<div class="center">'
      +'<div><div class="idle-title">🃏 Boerenbridge</div>'
      +'<div class="idle-sub">Geen actief spel — start een spel op je telefoon</div></div>'
      +lb
      +((tableFacts&&tableFacts.length)?'<div class="tablefact" id="tableFact"></div>':'')
      +'</div>';
    startFactRotation(tableFacts);
  }

  // Eén weetje tegelijk, elke 9 seconden een volgende. Alleen op het
  // idle-scherm; elke andere render zet de timer weer stil.
  // De plek in de rij overleeft een nieuwe idle-render (een afgebroken potje,
  // een verlopen winnaarscherm); alleen een andere lijst begint opnieuw.
  let factTimer=null, factIdx=0, factKey='';
  function startFactRotation(facts){
    clearInterval(factTimer);
    factTimer=null;
    const box=document.getElementById('tableFact');
    if(!box||!facts||!facts.length) return;
    const key=facts.map(f=>f.text).join('|');
    if(key!==factKey){ factKey=key; factIdx=Math.floor(Math.random()*facts.length); }
    const show=()=>{
      const f=facts[factIdx%facts.length];
      box.innerHTML='<span class="ic">'+f.icon+'</span><span>'+esc(f.text)+'</span>';
    };
    show();
    if(facts.length<2) return;
    factTimer=setInterval(()=>{
      box.classList.add('fade');
      setTimeout(()=>{ factIdx++; show(); box.classList.remove('fade'); },400);
    },9000);
  }

  // Elk scherm dat een grafiek bevat, tekent hem na het invoegen; bij een
  // andere schermgrootte opnieuw (de SVG is op de pixelmaat getekend).
  let resizeTimer=null;
  window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{ if(lastGame) drawTrend(lastGame); },150);
  });

  // ---- SSE + herstel ----
  function connect(){
    if(source) source.close();
    source = new EventSource(API+'/events');
    source.addEventListener('state',e=>{
      lastEventAt=Date.now();
      dot.classList.add('ok');
      try{ render(JSON.parse(e.data)); }catch(err){ console.error(err); }
    });
    source.addEventListener('ping',()=>{ lastEventAt=Date.now(); dot.classList.add('ok'); });
    source.onopen=()=>{ lastEventAt=Date.now(); dot.classList.add('ok'); };
    source.onerror=()=>{ dot.classList.remove('ok'); };
  }

  async function refetch(){
    try{
      const res=await fetch(API+'/current');
      if(res.ok){
        render(await res.json());
        lastEventAt=Date.now();
        dot.classList.add('ok');
      }
    }catch(e){ dot.classList.remove('ok'); }
  }

  // Watchdog: EventSource herstelt zichzelf meestal, maar iPad-Safari laat
  // verbindingen soms stil doodgaan — na 90 s zonder events opnieuw opbouwen.
  setInterval(()=>{
    if(Date.now()-lastEventAt>90000){ connect(); refetch(); }
  },15000);

  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){ connect(); refetch(); }
  });

  connect();
})();
</script>
</body>
</html>
